}
function loadQuizTextResponses(){fetch(`${PLATFORM_WORKER_URL}/conf/${encodeURIComponent(confSlug)}/quiz/text-responses`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminPin:pinInput})}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Could not load text responses.');quizTextResponses=d;quizTextResponsesError='';rerenderOrganizerScroll();}).catch(e=>{quizTextResponsesError=e.message;rerenderOrganizerScroll();});}
async function downloadQuizTextResponses(){try{const r=await fetch(`${PLATFORM_WORKER_URL}/conf/${encodeURIComponent(confSlug)}/quiz/text-responses/export`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminPin:pinInput})});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||'Could not create export.');}const blob=await r.blob();const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=`${confSlug}-text-responses.csv`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);}catch(e){alert(e.message);}}

function renderQuizEditor() {
  if (editQuizQuestions === null) {
    return `<div class="mini-label" style="margin:20px 0 8px;font-size:12px;">Quiz questions</div><div class="empty-note">Loading…</div>`;
  }
  return `
    <div class="mini-label" style="margin:20px 0 8px;font-size:12px;">Quiz questions</div>

    <div class="field-group">
      <label>Pass mark (%)</label>
      <input type="number" min="1" max="100" value="${editQuizPassPct}" oninput="onEditQuizPassPct(this.value)" style="max-width:120px;">
    </div>

    ${editQuizQuestions.map((q, i) => `
      <div class="quiz-edit-row">
        ${editQuizQuestions.length > 1 ? `<button class="remove-btn" onclick="removeQuizQuestion(${i})">✕</button>` : ""}
        <div style="margin-bottom:8px;">
          <span class="mini-label">Question ${i + 1}</span>
          <input type="text" value="${escHtml(q.text)}" placeholder="e.g. What is the recommended dose?" oninput="onEditQuizQuestion(${i},'text',this.value)">
        </div>
        <div style="margin:10px 0 12px;">
          <span class="mini-label">Image / short video (optional)</span>
          ${q.media ? `<div style="margin:8px 0;"><${q.media.type === 'video' ? 'video controls playsinline' : 'img'} src="${escHtml(q.media.data)}" ${q.media.type === 'video' ? 'style="width:100%;max-height:260px;border-radius:8px;background:#000;"' : 'style="max-width:100%;max-height:260px;border-radius:8px;object-fit:contain;"'}></${q.media.type === 'video' ? 'video' : 'img'}></div>` : ''}
          <input type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm" onchange="onQuizQuestionMedia(${i},this.files[0])">
          <div style="font-size:10.5px;color:var(--pf-muted);margin-top:5px;">Images up to 1 MB. Short MP4/WebM videos up to 8 MB.</div>
          ${q.media ? `<button type="button" class="remove-btn" style="position:static;margin-top:6px;" onclick="removeQuizQuestionMedia(${i})">Remove media</button>` : ''}
        </div>
        <div class="field-group" style="margin:10px 0;">
          <label>Question type</label>
          <select onchange="onEditQuizMode(${i},this.value)" style="width:100%;padding:9px;border:2px solid var(--pf-border);border-radius:8px;font-size:13px;">
            <option value="graded" ${q.mode !== 'survey' ? 'selected' : ''}>Graded — has a correct answer</option>
            <option value="survey" ${q.mode === 'survey' ? 'selected' : ''}>Survey — no correct answer</option>
          </select>
        </div>
        <span class="mini-label">Multiple-choice options ${q.mode === 'survey' ? '(optional)' : '(required)'}</span>
        ${[0,1,2,3].map(oi => `
          <div class="quiz-opt-edit-row">
            ${q.mode === 'survey' ? '' : `<input type="radio" name="correct-${i}" ${q.correctIndex === oi ? "checked" : ""} onchange="onEditQuizCorrect(${i},${oi})">`}
            <input type="text" value="${escHtml(q.options[oi] || "")}" placeholder="Option ${oi+1}" oninput="onEditQuizOption(${i},${oi},this.value)">
          </div>
        `).join("")}
        <label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px;"><input type="checkbox" ${q.textResponse ? 'checked' : ''} onchange="onEditQuizTextResponse(${i},this.checked)"> Include a text response field</label>
      </div>
    `).join("")}
    <button class="add-btn" onclick="addQuizQuestion()">+ Add question</button>
    <button class="save-btn" onclick="saveQuizQuestions()">Save quiz questions</button>
    <div class="save-status ${quizSaveStatusIsError ? 'error' : 'ok'}">${escHtml(quizSaveStatus)}</div>
  `;
}

function renderQuizAnalytics() {
  if (!quizAnalytics) return `
    <div class="mini-label" style="margin:24px 0 8px;font-size:12px;">Test results & data</div>
    <p style="font-size:11.5px;color:var(--pf-muted);margin-bottom:10px;">View aggregate results and download the complete participant answer file.</p>
    <button class="save-btn" onclick="loadQuizAnalytics()">Load test results</button>
    ${quizAnalyticsError ? `<div class="save-status error">${escHtml(quizAnalyticsError)}</div>` : ""}`;
  const s = quizAnalytics.summary || {};
  return `
    <div class="mini-label" style="margin:24px 0 8px;font-size:12px;">Test results & data</div>
    <div class="info-grid" style="margin-bottom:14px;">
      <div class="info-card"><span style="font-size:10px;color:var(--pf-muted);font-weight:bold;">PARTICIPANTS</span><strong>${s.expectedParticipants||0}</strong></div><div class="info-card"><span style="font-size:10px;color:var(--pf-muted);font-weight:bold;">SUBMISSIONS</span><strong>${s.submissions||0}</strong></div><div class="info-card"><span style="font-size:10px;color:var(--pf-muted);font-weight:bold;">NOT SUBMITTED</span><strong>${s.notSubmitted||0}</strong></div>
      <div class="info-card"><span style="font-size:10px;color:var(--pf-muted);font-weight:bold;">PASSED</span><strong>${s.passed||0}</strong></div>
      <div class="info-card"><span style="font-size:10px;color:var(--pf-muted);font-weight:bold;">FAILED</span><strong>${s.failed||0}</strong></div>
      <div class="info-card"><span style="font-size:10px;color:var(--pf-muted);font-weight:bold;">PASS RATE</span><strong>${s.passPct||0}%</strong></div>
      <div class="info-card"><span style="font-size:10px;color:var(--pf-muted);font-weight:bold;">AVERAGE SCORE</span><strong>${s.averageScorePct||0}%</strong></div>
    </div>
    <div class="info-card"><h3>Question statistics</h3>${(quizAnalytics.questionStats||[]).map(q=>`<div style="padding:9px 0;border-bottom:1px solid var(--pf-border);"><strong>${escHtml(q.id)}</strong> — ${escHtml(q.text)}<div style="font-size:11px;color:var(--pf-muted);margin-top:3px;">${q.mode==='survey' ? `${q.total} responses · No correct answer` : `${q.correct} correct · ${q.incorrect} incorrect · ${q.correctPct}% correct`}</div></div>`).join('') || '<div class="empty-note">No questions.</div>'}</div>
    <button class="save-btn" onclick="downloadQuizExport()">Download participant answers (.csv)</button>
    <button class="pin-btn" style="width:100%;margin-top:8px;" onclick="quizAnalytics=null;quizAnalyticsError='';rerenderOrganizerScroll()">Refresh results</button>
    ${quizAnalyticsError ? `<div class="save-status error">${escHtml(quizAnalyticsError)}</div>` : ""}`;
}

function loadQuizAnalytics() {
  quizAnalyticsLoading = true; quizAnalyticsError = ""; rerenderOrganizerScroll();
  fetch(`${PLATFORM_WORKER_URL}/conf/${encodeURIComponent(confSlug)}/quiz/results`, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({adminPin:pinInput}) })
    .then(async r => { const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||"Couldn't load results."); return d; })
    .then(d=>{quizAnalytics=d;quizAnalyticsLoading=false;rerenderOrganizerScroll();})
    .catch(e=>{quizAnalyticsLoading=false;quizAnalyticsError=e.message;rerenderOrganizerScroll();});
}

async function downloadQuizExport() {
  try {
    const r=await fetch(`${PLATFORM_WORKER_URL}/conf/${encodeURIComponent(confSlug)}/quiz/export`, {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({adminPin:pinInput})});
    if(!r.ok) { const d=await r.json().catch(()=>({})); throw new Error(d.error||"Couldn't create export."); }
    const blob=await r.blob(); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=`${confSlug}-quiz-results.csv`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  } catch(e) { alert(e.message); }
}

function renderQuizResetTool() {
  return `
    <div class="mini-label" style="margin:24px 0 8px;font-size:12px;">Reset a participant's quiz</div>
    <div class="field-row" style="align-items:flex-end;">
      <div class="field-group" style="margin-bottom:0;">
        <label>Participant number</label>
        <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="${escHtml(resetLookupNr)}" oninput="onResetLookupNr(this.value)">
      </div>
      <button class="save-btn" style="width:auto;padding:9px 16px;margin-top:0;" onclick="lookupQuizStatus()">Look up</button>
    </div>
    ${renderResetLookupResult()}
  `;
}

function renderResetLookupResult() {
  if (!resetLookupResult) return "";
  if (resetLookupResult.error) {
    return `<div class="save-status error">${escHtml(resetLookupResult.error)}</div>`;
  }
  if (!resetLookupResult.locked) {
    return `<div class="save-status ok">Participant ${escHtml(resetLookupNr)} hasn't submitted the quiz yet — nothing to reset.</div>`;
  }
  return `
    <div class="save-status ok">Participant ${escHtml(resetLookupNr)}: submitted${resetLookupResult.submittedAt ? " on " + new Date(resetLookupResult.submittedAt).toLocaleString("en-GB") : ""} — ${resetLookupResult.passed ? "Passed" : "Not passed"}.</div>
    <button class="save-btn" style="background:var(--pf-red);margin-top:8px;" onclick="doQuizReset()">Reset, so they can take it again</button>
  `;
}

function onToggleModule(key, checked) {
  if (!editMeta.modules) editMeta.modules = {};
  editMeta.modules[key] = !!checked;
  saveStatus = "";
  saveStatusIsError = false;
  // Module content is intentionally preserved when a module is turned off,
  // so an organizer can enable it again later without rebuilding it.
  if (key === 'quiz' && checked && editQuizQuestions === null) loadQuizForEdit();
  rerenderOrganizerScroll();
}

function ensureModuleContentDefaults() {
  const defaults = {
    handsOn:{title:'Hands on',intro:'',sessions:[newEditHandsOnSession()]}, map:{title:'Venue map',intro:'',address:'',image:''},
    industry:{title:'Industry',intro:'',booths:[newEditIndustryBooth()]}, quiz:{title:'Final test',intro:'Answer all questions. The test can only be taken once.'}, evaluations:{title:'Faculty evaluation',intro:'Evaluate each participant at your assigned post.',posts:[]}, conferenceFeedback:{title:'Conference evaluation',intro:'We would value your feedback.',prompt:'How would you evaluate the conference?'}, contact:{title:'Contact',intro:'',coordinatorName:'',coordinatorPhone:'',coordinatorEmail:'',supportName:'',supportPhone:'',supportEmail:'',image:''}
  };
  for (const key of Object.keys(defaults)) {
    const existing=editModuleContent[key]||{};
    if(key==='handsOn'&&!Array.isArray(existing.sessions)&&existing.date) existing.sessions=[{date:existing.date,startTime:existing.startTime||'09:00',endTime:existing.endTime||'11:30',rotationMinutes:existing.rotationMinutes||30,stationCount:existing.stationCount||5,stations:existing.stations||newEditHandsOnSession().stations}];
    if(key==='industry'&&!Array.isArray(existing.booths)&&existing.items) existing.booths=String(existing.items).split(/\r?\n/).filter(Boolean).map(line=>{const p=line.split('|').map(x=>x.trim());return {name:p[0]||'',description:p[1]||'',website:p[2]||'',image:''};});
    editModuleContent[key]=Object.assign({},defaults[key],existing);
  }
}
function onEditModuleContent(module,key,value) { editModuleContent[module][key] = value; }
function newEditHandsOnSession(){return {date:'',startTime:'09:00',endTime:'11:30',rotationMinutes:30,stationCount:5,stations:Array.from({length:5},(_,i)=>({name:`Station ${i+1}`,room:'',stand:`Stand ${i+1}`}))};}
function normalizeEditHandsOn(c){if(!Array.isArray(c.sessions))c.sessions=[{date:c.date||'',startTime:c.startTime||'09:00',endTime:c.endTime||'11:30',rotationMinutes:c.rotationMinutes||30,stationCount:c.stationCount||5,stations:c.stations||newEditHandsOnSession().stations}];return c;}
function addEditHandsOnSession(){editModuleContent.handsOn.sessions.push(newEditHandsOnSession());rerenderOrganizerScroll();}
function removeEditHandsOnSession(i){if(editModuleContent.handsOn.sessions.length>1)editModuleContent.handsOn.sessions.splice(i,1);rerenderOrganizerScroll();}
function onEditHandsOnCount(si,value){const c=editModuleContent.handsOn.sessions[si],count=Math.max(1,Math.min(30,parseInt(value)||1));c.stationCount=count;c.stations=c.stations||[];while(c.stations.length<count)c.stations.push({name:`Station ${c.stations.length+1}`,room:'',stand:`Stand ${c.stations.length+1}`});c.stations=c.stations.slice(0,count);rerenderOrganizerScroll();}
function onEditHandsOnSession(si,key,value){editModuleContent.handsOn.sessions[si][key]=value;}
function onEditHandsOnStation(si,i,key,value){editModuleContent.handsOn.sessions[si].stations[i][key]=value;}
function newEditIndustryBooth(){return {name:'',description:'',website:'',image:''};}
function normalizeEditIndustry(c){if(!Array.isArray(c.booths)){c.booths=String(c.items||'').split(/\r?\n/).filter(Boolean).map(line=>{const p=line.split('|').map(x=>x.trim());return {name:p[0]||'',description:p[1]||'',website:p[2]||'',image:''};});if(!c.booths.length)c.booths=[newEditIndustryBooth()];}return c;}
function addEditIndustryBooth(){if(editModuleContent.industry.booths.length>=12){alert('A maximum of 12 industry booths is supported.');return;}editModuleContent.industry.booths.push(newEditIndustryBooth());rerenderOrganizerScroll();}
function removeEditIndustryBooth(i){if(editModuleContent.industry.booths.length>1)editModuleContent.industry.booths.splice(i,1);rerenderOrganizerScroll();}
function onEditIndustryBooth(i,key,value){editModuleContent.industry.booths[i][key]=value;}
function onEditIndustryImage(i,file){if(!file)return;if(file.size>1024*1024){alert('The image must be smaller than 1 MB.');return;}const reader=new FileReader();reader.onload=()=>{editModuleContent.industry.booths[i].image=reader.result;rerenderOrganizerScroll();};reader.readAsDataURL(file);}
function renderOrganizerModuleContent(module) {
  const c=editModuleContent[module];
  let specific='';
  if(module==='handsOn'){normalizeEditHandsOn(c);specific=`${c.sessions.map((hs,si)=>`<div class="session-edit-row">${c.sessions.length>1?`<button class="remove-btn" onclick="removeEditHandsOnSession(${si})">✕</button>`:''}<h3 style="color:var(--pf-theme);margin-bottom:10px">Session ${si+1}</h3><div class="field-row"><div class="field-group"><label>Date</label><input type="date" value="${escHtml(hs.date)}" oninput="onEditHandsOnSession(${si},'date',this.value)"></div><div class="field-group"><label>Stations</label><input type="number" min="1" max="30" value="${hs.stationCount}" onchange="onEditHandsOnCount(${si},this.value)"></div></div><div class="field-row"><div class="field-group"><label>Start</label><input type="time" value="${escHtml(hs.startTime)}" oninput="onEditHandsOnSession(${si},'startTime',this.value)"></div><div class="field-group"><label>End</label><input type="time" value="${escHtml(hs.endTime)}" oninput="onEditHandsOnSession(${si},'endTime',this.value)"></div><div class="field-group"><label>Minutes</label><input type="number" min="5" step="5" value="${hs.rotationMinutes}" oninput="onEditHandsOnSession(${si},'rotationMinutes',parseInt(this.value)||30)"></div></div>${(hs.stations||[]).map((s,i)=>`<div class="session-edit-row"><span class="mini-label">Station ${i+1}</span><input value="${escHtml(s.name)}" oninput="onEditHandsOnStation(${si},${i},'name',this.value)"><div class="field-row"><div class="field-group"><label>Room</label><input value="${escHtml(s.room)}" oninput="onEditHandsOnStation(${si},${i},'room',this.value)"></div><div class="field-group"><label>Stand</label><input value="${escHtml(s.stand)}" oninput="onEditHandsOnStation(${si},${i},'stand',this.value)"></div></div></div>`).join('')}</div>`).join('')}<button class="add-btn" onclick="addEditHandsOnSession()">+ Add another session</button>`;}
  if(module==='map') specific=`<div class="field-group"><label>Address</label><input value="${escHtml(c.address)}" oninput="onEditModuleContent('map','address',this.value)"></div>${renderOrganizerImage('map')}`;
  if(module==='conferenceFeedback') specific=`<div class="field-group"><label>Question / prompt shown to participants</label><textarea oninput="onEditModuleContent('conferenceFeedback','prompt',this.value)">${escHtml(c.prompt||'How would you evaluate the conference?')}</textarea></div><div class="field-hint">Participants get one open text field. Responses appear under the organizer Text responses tab.</div>`;
    if(module==='industry'){normalizeEditIndustry(c);specific=`${c.booths.map((b,i)=>`<div class="session-edit-row">${c.booths.length>1?`<button class="remove-btn" onclick="removeEditIndustryBooth(${i})">✕</button>`:''}<span class="mini-label">Industry booth ${i+1}</span><div class="field-group"><label>Name</label><input value="${escHtml(b.name)}" oninput="onEditIndustryBooth(${i},'name',this.value)"></div><div class="field-group"><label>Description</label><textarea oninput="onEditIndustryBooth(${i},'description',this.value)">${escHtml(b.description)}</textarea></div><div class="field-group"><label>Website</label><input value="${escHtml(b.website)}" placeholder="https://..." oninput="onEditIndustryBooth(${i},'website',this.value)"></div><div class="field-group"><label>Image (maximum 1 MB)</label><input type="file" accept="image/*" onchange="onEditIndustryImage(${i},this.files[0])">${b.image?`<img class="content-image" src="${b.image}" alt="Preview"><button class="pin-btn" type="button" onclick="editModuleContent.industry.booths[${i}].image='';rerenderOrganizerScroll()">Remove image</button>`:''}</div></div>`).join('')}<button class="add-btn" onclick="addEditIndustryBooth()">+ Add industry booth</button>`;}
  if(module==='contact') specific=`<div class="field-group"><label>Coordinator name</label><input value="${escHtml(c.coordinatorName)}" oninput="onEditModuleContent('contact','coordinatorName',this.value)"></div><div class="field-row"><div class="field-group"><label>Phone</label><input value="${escHtml(c.coordinatorPhone)}" oninput="onEditModuleContent('contact','coordinatorPhone',this.value)"></div><div class="field-group"><label>Email</label><input value="${escHtml(c.coordinatorEmail)}" oninput="onEditModuleContent('contact','coordinatorEmail',this.value)"></div></div><div class="field-group"><label>Technical support name</label><input value="${escHtml(c.supportName)}" oninput="onEditModuleContent('contact','supportName',this.value)"></div><div class="field-row"><div class="field-group"><label>Support phone</label><input value="${escHtml(c.supportPhone)}" oninput="onEditModuleContent('contact','supportPhone',this.value)"></div><div class="field-group"><label>Support email</label><input value="${escHtml(c.supportEmail)}" oninput="onEditModuleContent('contact','supportEmail',this.value)"></div></div>${renderOrganizerImage('contact')}`;
  return `<details class="organizer-module" ${editOpenModule===module?'open':''} ontoggle="if(this.open)editOpenModule='${module}';else if(editOpenModule==='${module}')editOpenModule='' "><summary>Edit ${escHtml(c.title||module)}</summary><div class="organizer-module-body"><div class="field-group"><label>Heading</label><input value="${escHtml(c.title)}" oninput="onEditModuleContent('${module}','title',this.value)"></div><div class="field-group"><label>Introduction</label><textarea oninput="onEditModuleContent('${module}','intro',this.value)">${escHtml(c.intro)}</textarea></div>${specific}</div></details>`;
}
function renderOrganizerImage(module){const img=editModuleContent[module].image;return `<div class="field-group"><label>Image (maximum 1 MB)</label><input type="file" accept="image/*" onchange="onEditModuleImage('${module}',this.files[0])">${img?`<img class="content-image" src="${img}" alt="Preview"><button class="pin-btn" type="button" onclick="editModuleContent['${module}'].image='';rerenderOrganizerScroll()">Remove image</button>`:''}</div>`;}
function onEditModuleImage(module,file){if(!file)return;if(file.size>1024*1024){alert('The image must be smaller than 1 MB.');return;}const reader=new FileReader();reader.onload=()=>{editModuleContent[module].image=reader.result;rerenderOrganizerScroll();};reader.readAsDataURL(file);}

function onEditQuizPassPct(val) {
  editQuizPassPct = parseInt(val) || 0;
}

function onEditQuizQuestion(i, key, val) { editQuizQuestions[i][key] = val; }
function onEditQuizOption(i, oi, val) { editQuizQuestions[i].options[oi] = val; }
function onEditQuizMode(i, mode) { editQuizQuestions[i].mode = mode === 'survey' ? 'survey' : 'graded'; if(mode==='survey') editQuizQuestions[i].correctIndex=null; else if(editQuizQuestions[i].correctIndex===null) editQuizQuestions[i].correctIndex=0; rerenderOrganizerScroll(); }
function onEditQuizTextResponse(i, checked) { editQuizQuestions[i].textResponse = !!checked; rerenderOrganizerScroll(); }
function onQuizQuestionMedia(i, file) {
  if (!file) return;
  const isImage = file.type.startsWith('image/');
  const isVideo = file.type === 'video/mp4' || file.type === 'video/webm';
  const max = isImage ? 1024 * 1024 : 8 * 1024 * 1024;
  if (!isImage && !isVideo) { alert('Please choose a JPG, PNG, WebP, MP4 or WebM file.'); return; }
  if (file.size > max) { alert(isImage ? 'The image must be smaller than 1 MB.' : 'The video must be smaller than 8 MB.'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    editQuizQuestions[i].media = { type: isImage ? 'image' : 'video', mime: file.type, data: reader.result };
    rerenderOrganizerScroll();
  };
  reader.readAsDataURL(file);
}
function removeQuizQuestionMedia(i) { delete editQuizQuestions[i].media; rerenderOrganizerScroll(); }
function onEditQuizCorrect(i, oi) {
  editQuizQuestions[i].correctIndex = oi;
  rerenderOrganizerScroll();
}
function addQuizQuestion() {
  editQuizQuestions.push(blankQuizQuestion());
  rerenderOrganizerScroll();
}
function removeQuizQuestion(i) {
  editQuizQuestions.splice(i, 1);
  rerenderOrganizerScroll();
}

function saveQuizQuestions() {
  quizSaveStatus = "Saving…"; quizSaveStatusIsError = false;
  rerenderOrganizerScroll();

  const cleanQuestions = editQuizQuestions.filter(q => {
    if (!q.text || !q.text.trim()) return false;
    const options = (q.options || []).filter(Boolean);
    return q.mode === 'survey' ? (options.length >= 1 || q.textResponse) : (options.length === 4 && Number.isInteger(q.correctIndex) && !!options[q.correctIndex]);
  }).map(q => Object.assign({}, q, { mode:q.mode==='survey'?'survey':'graded', correctIndex:q.mode==='survey'?null:q.correctIndex, textResponse:!!q.textResponse }));
  if (cleanQuestions.length === 0 || cleanQuestions.length !== editQuizQuestions.filter(q=>q.text && q.text.trim()).length) {
    quizSaveStatus = "Each question needs a valid setup. Graded questions need 4 options and a correct answer; survey questions need at least one option or a text field.";
    quizSaveStatusIsError = true;
    rerenderOrganizerScroll();
    return;
  }

  const payload = {
    adminPin: pinInput,
    quizQuestions: cleanQuestions,
    quizConfig: { passThreshold: Math.min(1, Math.max(0.01, editQuizPassPct / 100)) },
  };

  if (!PLATFORM_WORKER_URL) {
    console.log("Simulated quiz question save (PLATFORM_WORKER_URL is not set yet):", payload);
    quizSaveStatus = "Saved (simulated — no backend connected yet).";
    quizSaveStatusIsError = false;
    rerenderOrganizerScroll();
    return;
  }

  fetch(`${PLATFORM_WORKER_URL}/conf/${encodeURIComponent(confSlug)}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  })
    .then(async (res) => {
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ("Server error (" + res.status + ")"));
      quizSaveStatus = "Saved — participants will see the updated quiz.";
      quizSaveStatusIsError = false;
      rerenderOrganizerScroll();
    })
    .catch((err) => {
      quizSaveStatus = "Couldn't save: " + err.message;
      quizSaveStatusIsError = true;
      rerenderOrganizerScroll();
    });
}

function onResetLookupNr(val) { resetLookupNr = val.replace(/\D/g, ""); }

function lookupQuizStatus() {
  if (!resetLookupNr) return;
  resetLookupResult = null;
  rerenderOrganizerScroll();

  if (!PLATFORM_WORKER_URL) {
    resetLookupResult = { locked: false };
    rerenderOrganizerScroll();
    return;
  }

  fetch(`${PLATFORM_WORKER_URL}/conf/${encodeURIComponent(confSlug)}/quiz/status?nr=${encodeURIComponent(resetLookupNr)}`)
    .then(res => res.json())
    .then(data => { resetLookupResult = data; rerenderOrganizerScroll(); })
    .catch(() => { resetLookupResult = { error: "Couldn't check status." }; rerenderOrganizerScroll(); });
}

function doQuizReset() {
  if (!confirm(`Reset the quiz for participant ${resetLookupNr}? They'll be able to take it again.`)) return;

  if (!PLATFORM_WORKER_URL) {
    console.log("Simulated quiz reset (PLATFORM_WORKER_URL is not set yet) for nr", resetLookupNr);
    resetLookupResult = { locked: false };
    rerenderOrganizerScroll();
    return;
  }

  fetch(`${PLATFORM_WORKER_URL}/conf/${encodeURIComponent(confSlug)}/quiz/reset`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ nr: resetLookupNr, adminPin: pinInput }),
  })
    .then(res => res.json())
    .then(() => { resetLookupResult = { locked: false }; rerenderOrganizerScroll(); })
    .catch(() => alert("Couldn't reset — check your connection."));
}


function onEditMeta(key, val) { editMeta[key] = val; }
function onEditSession(i, key, val) { editSessions[i][key] = val; }
function onEditTimeInput(input, i) {
  const digits = input.value.replace(/\D/g, "").slice(0, 4);
  let value = digits.slice(0, 2);
  if (digits.length >= 2) value += ":" + digits.slice(2);
  input.value = value;
  editSessions[i].time = value;
}
function addEditSession() {
  editSessions.push({ date: "", time: "", title: "", speaker: "" });
  rerenderOrganizerScroll();
}
function removeEditSession(i) {
  editSessions.splice(i, 1);
  rerenderOrganizerScroll();
}
function rerenderOrganizerScroll() {
  setHtmlPreservingFocus(document.getElementById("organizerScroll"), renderOrganizerEditor());
}

function onEditConferenceLogo(file){
  if(!file)return;
  if(file.size>1024*1024){alert("The logo must be smaller than 1 MB.");return;}
  if(!file.type.startsWith("image/")){alert("Please choose an image file.");return;}
  const reader=new FileReader();
  reader.onload=()=>{if(!editMeta.branding)editMeta.branding={};editMeta.branding.logo=reader.result;rerenderOrganizerScroll();};
  reader.readAsDataURL(file);
}

function saveOrganizerChanges() {
  if(editMeta.modules && editMeta.modules.handsOn && !validHandsOnConfig(editModuleContent.handsOn)){alert('Hands on is not valid. Add a date and make sure the total time fits every rotation (stations × minutes per rotation).');return;}
  saveStatus = "Saving…"; saveStatusIsError = false;
  rerenderOrganizerScroll();

  const payload = {
    adminPin: pinInput,
    name: editMeta.name,
    startDate: editMeta.startDate,
    endDate: editMeta.endDate,
    contactEmail: editMeta.contactEmail,
    participantCount: editMeta.participantCount,
    facultyCount: editMeta.facultyCount,
    branding: editMeta.branding || {logo:""},
    modules: editMeta.modules,
    moduleContent: editModuleContent,
    sessions: editSessions.filter(s => s.title && s.title.trim()),
  };

  if (!PLATFORM_WORKER_URL) {
    console.log("Simulated save (PLATFORM_WORKER_URL is not set yet):", payload);
    confData.meta = Object.assign({}, confData.meta, payload);
    confData.schedule = payload.sessions;
    confData.moduleContent = payload.moduleContent;
    saveStatus = "Saved (simulated — no backend connected yet)."; saveStatusIsError = false;
    rerenderOrganizerScroll();
    return;
  }

  fetch(`${PLATFORM_WORKER_URL}/conf/${encodeURIComponent(confSlug)}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  })
    .then(async (res) => {
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ("Server error (" + res.status + ")"));
      confData.meta = Object.assign({}, confData.meta, payload);
      confData.schedule = payload.sessions;
      confData.moduleContent = payload.moduleContent;
      saveStatus = "Saved — participants will see the update next time they load the page.";
      saveStatusIsError = false;
      rerenderOrganizerScroll();
    })
    .catch((err) => {
      saveStatus = "Couldn't save: " + err.message;
      saveStatusIsError = true;
      rerenderOrganizerScroll();
    });
}
function validHandsOnConfig(c){if(!c)return false;const sessions=normalizeEditHandsOn(c).sessions;return sessions.length>0&&sessions.every(s=>!!s.date&&minutesOf(s.endTime)>minutesOf(s.startTime)&&(minutesOf(s.endTime)-minutesOf(s.startTime))>=Number(s.stationCount||0)*Number(s.rotationMinutes||0));}

function escHtml(str) {
  return String(str || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

loadConference();
</script>
