<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Platform Admin — Conf Design</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#172235;font-family:Arial,sans-serif;padding:24px 12px}.shell{max-width:860px;margin:auto}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.header h1{color:#07558f;font-size:24px}.back{color:#07558f;font-weight:bold;text-decoration:none}.card{background:#fff;border:1px solid #cfdae3;border-radius:14px;padding:20px;margin-bottom:14px}.login{max-width:460px;margin:60px auto}.field{margin-bottom:14px}label{display:block;font-size:12px;font-weight:bold;margin-bottom:6px}input{width:100%;min-height:46px;border:2px solid #cfdae3;border-radius:9px;padding:10px 12px;font-size:16px}button{border:0;border-radius:9px;min-height:44px;padding:10px 14px;font-weight:bold;cursor:pointer}.primary{background:#07558f;color:#fff;width:100%}.danger{background:#b3261e;color:#fff}.secondary{background:#e5f0f8;color:#07558f}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.conf-head{display:flex;justify-content:space-between;gap:12px}.conf-name{color:#07558f;font-size:18px;font-weight:bold}.meta{color:#647181;font-size:13px;margin-top:5px}.status{min-height:20px;margin-top:10px;color:#b3261e;font-size:13px}.empty{text-align:center;color:#647181;padding:30px}@media(max-width:600px){body{padding:0 12px 30px;background:#fff}.header{padding-top:16px}.card{padding:16px;border-radius:12px}.login{margin:30px auto}.conf-head{display:block}.actions button{width:100%}}
</style></head>
<body><div class="shell"><div class="header"><h1>Platform Admin</h1><a class="back" href="login.html">← Login</a></div><div id="app"></div></div>
<script>
const WORKER="https://cm-worker.conferenceplanner.workers.dev";let password="",conferences=[],message="";
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function renderLogin(){document.getElementById('app').innerHTML=`<div class="card login"><h2>Admin login</h2><p class="meta" style="margin-bottom:16px">Use the platform password stored securely in Cloudflare.</p><div class="field"><label>Admin password</label><input id="adminPassword" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div><button class="primary" onclick="login()">Open admin dashboard</button><div class="status">${esc(message)}</div></div>`;}
async function api(action,data={}){const r=await fetch(`${WORKER}/admin/${action}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password,...data})});const out=await r.json().catch(()=>({}));if(!r.ok)throw Error(out.error||`Server error (${r.status})`);return out;}
async function login(){password=document.getElementById('adminPassword').value;message='';try{const d=await api('list');conferences=d.conferences||[];renderDashboard()}catch(e){message=e.message;password='';renderLogin()}}
function renderDashboard(){document.getElementById('app').innerHTML=`<div class="card"><div class="conf-head"><div><h2>All conferences</h2><p class="meta">${conferences.length} conference${conferences.length===1?'':'s'} stored</p></div><button class="secondary" onclick="refresh()">Refresh</button></div><div class="status">${esc(message)}</div></div>${conferences.length?conferences.map(c=>`<div class="card"><div class="conf-name">${esc(c.name)}</div><div class="meta">Code: ${esc((c.slug||'').toUpperCase())} · ${esc(c.startDate)} – ${esc(c.endDate)} · ${Number(c.participantCount)||0} participants · ${Number(c.facultyCount)||0} faculty</div><div class="actions"><a href="index.html?conf=${encodeURIComponent(c.slug)}&admin=1"><button class="secondary">Open organizer page</button></a><button class="secondary" onclick="resetQuizzes('${c.slug}')">Reset all quiz submissions</button><button class="secondary" onclick="resetPin('${c.slug}')">Set new organizer PIN</button><button class="danger" onclick="deleteConference('${c.slug}')">Delete conference</button></div></div>`).join(''):`<div class="card empty">No conferences have been created.</div>`}`;}
async function refresh(){try{const d=await api('list');conferences=d.conferences||[];message='';renderDashboard()}catch(e){message=e.message;renderDashboard()}}
async function resetQuizzes(slug){if(!confirm(`Reset every quiz submission for ${slug.toUpperCase()}?`))return;try{const d=await api('reset-quizzes',{slug});message=`Reset ${d.resetCount||0} quiz submissions.`;await refresh()}catch(e){message=e.message;renderDashboard()}}
async function resetPin(slug){const newPin=prompt(`Enter a new 4–6 digit organizer PIN for ${slug.toUpperCase()}:`);if(newPin===null)return;if(!/^\d{4,6}$/.test(newPin)){alert('PIN must be 4–6 digits.');return}try{await api('reset-pin',{slug,newPin});message=`Organizer PIN updated for ${slug.toUpperCase()}.`;renderDashboard()}catch(e){message=e.message;renderDashboard()}}
async function deleteConference(slug){const c=conferences.find(x=>x.slug===slug),name=c?c.name:slug.toUpperCase();if(!confirm(`Permanently delete “${name}” and all its quiz submissions? This cannot be undone.`))return;try{await api('delete',{slug});message=`Deleted ${slug.toUpperCase()}.`;await refresh()}catch(e){message=e.message;renderDashboard()}}
renderLogin();
</script></body></html>
