<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Platform Admin — Conf Design</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#172235;font-family:Arial,sans-serif;padding:24px 12px}.shell{max-width:980px;margin:auto}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.header h1{color:#07558f;font-size:24px}.back{color:#07558f;font-weight:bold;text-decoration:none}.card{background:#fff;border:1px solid #cfdae3;border-radius:14px;padding:20px;margin-bottom:14px}.login{max-width:460px;margin:60px auto}.field{margin-bottom:14px}label{display:block;font-size:12px;font-weight:bold;margin-bottom:6px}input,select{width:100%;min-height:46px;border:2px solid #cfdae3;border-radius:9px;padding:10px 12px;font-size:16px}button{border:0;border-radius:9px;min-height:44px;padding:10px 14px;font-weight:bold;cursor:pointer}.primary{background:#07558f;color:#fff;width:100%}.danger{background:#b3261e;color:#fff}.secondary{background:#e5f0f8;color:#07558f}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.conf-head{display:flex;justify-content:space-between;gap:12px}.conf-name{color:#07558f;font-size:18px;font-weight:bold}.meta{color:#647181;font-size:13px;margin-top:5px}.status{min-height:20px;margin-top:10px;color:#b3261e;font-size:13px}.empty{text-align:center;color:#647181;padding:30px}.data-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.stat{background:#f5f7fa;border:1px solid #dbe2e8;border-radius:10px;padding:12px}.stat span{display:block;font-size:10px;color:#647181;font-weight:bold}.stat strong{display:block;font-size:20px;margin-top:5px}.subtle{color:#647181;font-size:12px}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;font-size:12px}.data-table th,.data-table td{text-align:left;border-bottom:1px solid #e1e6eb;padding:8px;vertical-align:top}.tabbar{display:flex;gap:6px;border-bottom:1px solid #dbe2e8;margin:0 -20px 16px;padding:0 20px}.tab{padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;font-weight:bold;font-size:12px}.tab.active{color:#07558f;border-bottom-color:#07558f}.pill{display:inline-block;padding:3px 7px;border-radius:999px;font-weight:bold;font-size:10px;background:#e5f0f8;color:#07558f}.pill.fail{background:#fbecea;color:#b3261e}.response{white-space:pre-wrap;max-width:500px}@media(max-width:600px){body{padding:0 12px 30px;background:#fff}.header{padding-top:16px}.card{padding:16px;border-radius:12px}.login{margin:30px auto}.conf-head,.data-head{display:block}.actions button{width:100%}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.tabbar{margin:0 -16px 16px;padding:0 16px;overflow:auto}.tab{white-space:nowrap}}
</style></head>
<body><div class="shell"><div class="header"><h1>Platform Admin</h1><a class="back" href="login.html">← Login</a></div><div id="app"></div></div>
<script>
const WORKER="https://cm-worker.conferenceplanner.workers.dev";
let password="",conferences=[],message="",selectedSlug="",selectedData=null,selectedTab="overview",loadingData=false;
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
async function api(action,data={}){const r=await fetch(`${WORKER}/admin/${action}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password,...data})});const out=await r.json().catch(()=>({}));if(!r.ok)throw Error(out.error||`Server error (${r.status})`);return out}
function renderLogin(){document.getElementById('app').innerHTML=`<div class="card login"><h2>Admin login</h2><p class="meta" style="margin-bottom:16px">Use the platform password stored securely in Cloudflare.</p><div class="field"><label>Admin password</label><input id="adminPassword" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div><button class="primary" onclick="login()">Open admin dashboard</button><div class="status">${esc(message)}</div></div>`}
async function login(){password=document.getElementById('adminPassword').value;message='';try{const d=await api('list');conferences=d.conferences||[];renderDashboard()}catch(e){message=e.message;password='';renderLogin()}}
function renderDashboard(){document.getElementById('app').innerHTML=`<div class="card"><div class="conf-head"><div><h2>All conferences</h2><p class="meta">${conferences.length} conference${conferences.length===1?'':'s'} stored</p></div><button class="secondary" onclick="refresh()">Refresh</button></div><div class="status">${esc(message)}</div></div>${conferences.length?conferences.map(c=>`<div class="card"><div class="conf-name">${esc(c.name)}</div><div class="meta">Code: ${esc((c.slug||'').toUpperCase())} · ${esc(c.startDate)} – ${esc(c.endDate)} · ${Number(c.participantCount)||0} participants · ${Number(c.facultyCount)||0} faculty</div><div class="meta"><strong>Organizer PIN:</strong> <code>${esc(c.organizerPin||'—')}</code></div><div class="actions"><button class="primary" style="width:auto" onclick="openTestData('${esc(c.slug)}')">Open test data</button><a href="index.html?conf=${encodeURIComponent(c.slug)}&admin=1"><button class="secondary">Open organizer page</button></a><button class="secondary" onclick="resetQuizzes('${esc(c.slug)}')">Reset all quiz submissions</button><button class="secondary" onclick="resetPin('${esc(c.slug)}')">Change organizer PIN</button><button class="danger" onclick="deleteConference('${esc(c.slug)}')">Delete conference</button></div></div>`).join(''):`<div class="card empty">No conferences have been created.</div>`}`}
async function refresh(){try{const d=await api('list');conferences=d.conferences||[];message='';renderDashboard()}catch(e){message=e.message;renderDashboard()}}
async function openTestData(slug){selectedSlug=slug;selectedData=null;selectedTab='overview';loadingData=true;message='';renderTestData();try{selectedData=await api(slug);loadingData=false;renderTestData()}catch(e){loadingData=false;message=e.message;renderTestData()}}
function renderTestData(){const c=conferences.find(x=>x.slug===selectedSlug);if(!selectedSlug){renderDashboard();return}document.getElementById('app').innerHTML=`<div class="card"><div class="data-head"><div><h2>Test data</h2><p class="meta">${esc(c?.name||selectedSlug)} · ${esc(selectedSlug.toUpperCase())}</p></div><button class="secondary" onclick="selectedSlug='';selectedData=null;renderDashboard()">← All conferences</button></div>${loadingData?'<p class="subtle">Loading test data…</p>':selectedData?renderDataBody():`<div class="status">${esc(message||'Could not load test data.')}</div>`}</div>`}
function renderDataBody(){const s=selectedData.summary||{},tabs=[['overview','Overview'],['participants','Participant results'],['questions','Question statistics'],['text','Text responses']];return `<div class="tabbar">${tabs.map(t=>`<div class="tab ${selectedTab===t[0]?'active':''}" onclick="selectedTab='${t[0]}';renderTestData()">${t[1]}</div>`).join('')}</div>${selectedTab==='overview'?renderOverview(s):selectedTab==='participants'?renderParticipants():selectedTab==='questions'?renderQuestions():renderTextResponses()}`}
function renderOverview(s){return `<div class="stats"><div class="stat"><span>SUBMISSIONS</span><strong>${s.submissions||0}</strong></div><div class="stat"><span>NOT SUBMITTED</span><strong>${s.notSubmitted||0}</strong></div><div class="stat"><span>PASSED</span><strong>${s.passed||0}</strong></div><div class="stat"><span>FAILED</span><strong>${s.failed||0}</strong></div></div><div class="stats"><div class="stat"><span>PASS RATE</span><strong>${s.passPct==null?'—':s.passPct+'%'}</strong></div><div class="stat"><span>AVERAGE SCORE</span><strong>${s.averageScorePct==null?'—':s.averageScorePct+'%'}</strong></div></div><div class="actions"><button class="primary" style="width:auto" onclick="downloadQuizExport()">Download participant results (.csv)</button></div>`}
function renderParticipants(){const qs=selectedData.records||[],questions=selectedData.questionStats||[];return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Participant</th><th>Email</th>${questions.map(q=>`<th>${esc(q.id)}</th>`).join('')}<th>Score</th><th>Result</th><th>Submitted</th></tr></thead><tbody>${qs.map(r=>`<tr><td>${esc(r.nr)}</td><td>${esc(r.email)}</td>${questions.map(q=>{const a=r.answers?.[q.id];const choice=a&&typeof a==='object'?a.choice:a;const text=a&&typeof a==='object'?a.text:'';const ct=(choice!==null&&choice!==undefined&&selectedData.questionStats.find(x=>x.id===q.id)&&selectedData.questionStats.find(x=>x.id===q.id).mode!=='survey')?choice:'';return `<td>${esc(text || choice || '')}</td>`}).join('')}<td>${r.scorePct==null?'—':esc(r.scorePct+'%')}</td><td>${r.passed==null?'—':`<span class="pill ${r.passed?'':'fail'}">${r.passed?'PASS':'FAIL'}</span>`}</td><td>${esc(r.submittedAt||'')}</td></tr>`).join('')}</tbody></table></div>`}
function renderQuestions(){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Question</th><th>Type</th><th>Responses</th><th>Correct</th><th>Incorrect</th><th>% Correct</th></tr></thead><tbody>${(selectedData.questionStats||[]).map(q=>`<tr><td><strong>${esc(q.id)}</strong><br>${esc(q.text)}</td><td>${q.mode==='survey'?'Survey':'Graded'}</td><td>${q.total||0}</td><td>${q.correct==null?'—':q.correct}</td><td>${q.incorrect==null?'—':q.incorrect}</td><td>${q.correctPct==null?'—':q.correctPct+'%'}</td></tr>`).join('')}</tbody></table></div>`}
function renderTextResponses(){const rows=selectedData.textResponses||[];return `<div class="actions"><button class="primary" style="width:auto" onclick="downloadQuizExport()">Download full results (.csv)</button></div>${rows.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Participant</th><th>Email</th><th>Question</th><th>Response</th><th>Submitted</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.nr)}</td><td>${esc(r.email)}</td><td>${esc(r.questionText)}</td><td class="response">${esc(r.response)}</td><td>${esc(r.submittedAt)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="subtle">No text responses have been submitted.</p>'}`}
async function downloadQuizExport(){try{const r=await fetch(`${WORKER}/admin/${encodeURIComponent(selectedSlug)}/export`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(d.error||`Server error (${r.status})`)}const blob=await r.blob(),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`${selectedSlug}-quiz-results.csv`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u)}catch(e){alert(e.message)}}
async function resetQuizzes(slug){if(!confirm(`Reset every quiz submission for ${slug.toUpperCase()}?`))return;try{const d=await api('reset-quizzes',{slug});message=`Reset ${d.resetCount||0} quiz submissions.`;await refresh()}catch(e){message=e.message;renderDashboard()}}
async function resetPin(slug){const newPin=prompt(`Enter a new 4–6 digit organizer PIN for ${slug.toUpperCase()}:`);if(newPin===null)return;if(!/^\d{4,6}$/.test(newPin)){alert('PIN must be 4–6 digits.');return}try{await api('reset-pin',{slug,newPin});message=`Organizer PIN updated for ${slug.toUpperCase()}.`;renderDashboard()}catch(e){message=e.message;renderDashboard()}}
async function deleteConference(slug){const c=conferences.find(x=>x.slug===slug),name=c?c.name:slug.toUpperCase();if(!confirm(`Permanently delete “${name}” and all its data? This cannot be undone.`))return;try{await api('delete',{slug});message=`Deleted ${slug.toUpperCase()}.`;await refresh()}catch(e){message=e.message;renderDashboard()}}
renderLogin();
</script></body></html>
