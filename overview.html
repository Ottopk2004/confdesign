<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>All Conferences — Conf Design</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pf-ink:        #1E2233;
    --pf-indigo:      #3E4C9C;
    --pf-indigo-light:#EEF0FA;
    --pf-white:       #FFFFFF;
    --pf-gray:        #F5F6FA;
    --pf-border:      #DADFF0;
    --pf-muted:       #656B85;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #eef0f6;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 12px 60px;
    color: var(--pf-ink);
  }

  .shell { width: 100%; max-width: 640px; }

  .top-brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 20px;
  }
  .top-brand-left { display: flex; align-items: center; gap: 10px; }
  .top-brand .mark {
    width: 34px; height: 34px; border-radius: 8px;
    background: var(--pf-indigo); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 15px; flex-shrink: 0;
  }
  .top-brand h1 { font-size: 16px; color: var(--pf-ink); }
  .top-brand p { font-size: 11.5px; color: var(--pf-muted); }

  .new-btn {
    background: var(--pf-indigo); color: #fff; border: none;
    padding: 10px 16px; border-radius: 8px; font-size: 12.5px; font-weight: bold;
    cursor: pointer; text-decoration: none; display: inline-block; white-space: nowrap;
  }
  .new-btn:hover { filter: brightness(0.92); }

  .search-box {
    width: 100%; padding: 11px 14px; border: 2px solid var(--pf-border); border-radius: 10px;
    font-size: 14px; margin-bottom: 18px; font-family: inherit;
  }
  .search-box:focus { border-color: var(--pf-indigo); outline: none; }

  .conf-card {
    background: var(--pf-white);
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(30,34,51,0.07);
    margin-bottom: 12px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: block;
    transition: transform 0.1s;
  }
  .conf-card:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(30,34,51,0.12); }
  .conf-card .stripe { height: 6px; }
  .conf-card .body { padding: 14px 16px; }
  .conf-card .name { font-size: 15px; font-weight: bold; margin-bottom: 4px; }
  .conf-card .dates { font-size: 12px; color: var(--pf-muted); }
  .conf-card .badge {
    display: inline-block; margin-top: 8px; font-size: 10.5px; font-weight: bold;
    padding: 3px 8px; border-radius: 999px; background: var(--pf-indigo-light); color: var(--pf-indigo);
  }

  .state-note {
    text-align: center; color: var(--pf-muted); font-size: 13px; padding: 40px 20px;
    background: var(--pf-white); border-radius: 12px;
  }
  .state-note a { color: var(--pf-indigo); font-weight: bold; }
</style>
<style>
@media (max-width: 600px) {
  body { padding:0 12px 40px; background:#fff; }
  .shell { max-width:none; }
  .top-brand { padding-top:14px; gap:10px; }
  .top-brand-left { min-width:0; }
  .new-btn { min-height:44px; display:flex; align-items:center; padding:10px 14px; }
  .search-box { min-height:48px; font-size:16px; }
  .conf-card { border-radius:12px; }
  .conf-card .body { padding:15px 13px; }
  .conf-card .name { font-size:15px; }
}
</style>
</head>
<body>

<div class="shell">
  <div class="top-brand">
    <div class="top-brand-left">
      <div class="mark">CD</div>
      <div>
        <h1>Conf Design</h1>
        <p>All conferences on this platform</p>
      </div>
    </div>
  </div>

  <input type="text" class="search-box" id="searchBox" placeholder="Search conferences…" oninput="onSearch(this.value)">

  <div id="list"></div>
</div>

<script>
// Point this at your platform worker once it's deployed (see
// platform-setup-guide.md). Falls back to a small built-in demo list so
// the page can be built and tested before the backend exists.
const PLATFORM_WORKER_URL = "https://cm-worker.conferenceplanner.workers.dev";

const DEMO_LIST = [
  { slug: "demo", name: "Demo Conference 2027", startDate: "2027-06-10", endDate: "2027-06-11", themeColor: "#3E4C9C", participantCount: 50 },
];

let allConferences = [];
let searchTerm = "";

async function load() {
  if (!PLATFORM_WORKER_URL) {
    allConferences = DEMO_LIST;
    render();
    return;
  }
  try {
    const res = await fetch(`${PLATFORM_WORKER_URL}/conf/list`);
    if (!res.ok) throw new Error("bad response");
    const data = await res.json();
    allConferences = data.conferences || [];
  } catch (err) {
    document.getElementById("list").innerHTML = `<div class="state-note">Couldn't load the conference list. Check your internet connection and reload.</div>`;
    return;
  }
  render();
}

function onSearch(val) {
  searchTerm = val.toLowerCase();
  render();
}

function render() {
  const el = document.getElementById("list");
  const filtered = allConferences.filter(c => c.name.toLowerCase().includes(searchTerm));

  if (allConferences.length === 0) {
    el.innerHTML = `<div class="state-note">No conferences yet. <a href="create.html">Create the first one →</a></div>`;
    return;
  }
  if (filtered.length === 0) {
    el.innerHTML = `<div class="state-note">No conferences match "${escHtml(searchTerm)}".</div>`;
    return;
  }

  el.innerHTML = filtered.map(c => `
    <a class="conf-card" href="index.html?conf=${encodeURIComponent(c.slug)}">
      <div class="stripe" style="background:${escHtml(c.themeColor || '#3E4C9C')};"></div>
      <div class="body">
        <div class="name">${escHtml(c.name)}</div>
        <div class="dates">${formatDateRange(c.startDate, c.endDate)} · up to ${c.participantCount} participants</div>
      </div>
    </a>
  `).join("");
}

function formatDateRange(start, end) {
  if (!start || !end) return "Dates TBA";
  const s = new Date(start + "T00:00:00"), e = new Date(end + "T00:00:00");
  if (isNaN(s) || isNaN(e)) return "Dates TBA";
  const opts = { day: "numeric", month: "long", year: "numeric" };
  if (start === end) return s.toLocaleDateString("en-GB", opts);
  return `${s.toLocaleDateString("en-GB", { day: "numeric", month: "long" })} – ${e.toLocaleDateString("en-GB", opts)}`;
}

function escHtml(str) {
  return String(str || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

load();
</script>

</body>
</html>
